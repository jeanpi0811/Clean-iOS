name: CleanOS Pro Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CleanOS-Pro/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx tsc --noEmit
      - run: npx jest --runInBand --watchAll=false

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CleanOS-Pro/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx prisma generate
      - run: npx jest --runInBand --watchAll=false
