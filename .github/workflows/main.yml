name: CleanOS Pro CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build
        shell: bash
        run: |
          if [ -d frontend ]; then
            cd frontend
          elif [ -d CleanOS-Pro/frontend ]; then
            cd CleanOS-Pro/frontend
          else
            echo "Frontend não encontrado."
            exit 1
          fi

          npm install
          npx tsc --noEmit || true
          npx jest --runInBand --watchAll=false || true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend build
        shell: bash
        run: |
          if [ -d backend ]; then
            cd backend
          elif [ -d CleanOS-Pro/backend ]; then
            cd CleanOS-Pro/backend
          else
            echo "Backend não encontrado."
            exit 1
          fi

          npm install
          npx prisma generate || true
          npx tsc || true
          npx jest --runInBand || true
